name: Refresh prices and publish Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: price-watch-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check supported sources
        if: github.event_name != 'push'
        run: python scripts/update.py
      - name: Validate and test
        run: python -m unittest discover -s tests -v
      - name: Retain daily result
        if: github.event_name != 'push'
        run: |
          git config user.name 'price-watch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update dated price quotes and source check report'
            git push
          fi
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate static pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
