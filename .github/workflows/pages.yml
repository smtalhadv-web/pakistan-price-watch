name: Refresh prices and publish Pages
on:
  push:
    branches: [main]
  schedule:
    # 08:30 and 20:30 Asia/Karachi (UTC+5). GitHub may delay scheduled jobs.
    - cron: '30 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: price-watch-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source readers
        run: python -m pip install -r requirements.txt
      - name: Fetch current prices and retain verified observations
        run: python scripts/update.py
      - name: Retain refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-refresh-status
          path: data/refresh-status.json
          retention-days: 14
      - name: Fetch daily economy business and trade briefings
        run: python scripts/news.py
      - name: Validate and test
        run: python -m unittest discover -s tests -v
      - name: Retain daily result
        run: |
          git config user.name 'price-watch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Update dated price quotes and source check report'
            git push
          fi
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate static pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
